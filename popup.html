<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自动填写简历机器人</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img class="mark" src="icons/resume-48.png" alt="">
        <div>
          <h1>自动填写简历机器人</h1>
          <p>本地资料 · 当前页填写</p>
        </div>
      </div>
      <div>
        <button id="auditButton" class="audit" type="button" title="解析当前页面">解</button>
      </div>
    </header>

    <button id="profileButton" class="secondary" type="button">编辑资料</button>
    <button id="fillButton" class="primary" type="button">填写当前页面</button>
    <label class="option">
      <input id="overwriteInput" type="checkbox">
      <span>覆盖页面已有值</span>
    </label>

    <div id="result" class="result" aria-live="polite"></div>
  </main>
  <script src="profile-schema.js"></script>
  <script src="popup.js"></script>
</body>
</html>
