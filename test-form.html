<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>简历填表插件测试页</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 40px auto; color: #1f2937; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    label, fieldset { display: grid; gap: 6px; }
    input, textarea, select, [contenteditable] { padding: 9px; border: 1px solid #bbb; border-radius: 6px; }
    textarea, .wide { grid-column: 1 / -1; }
    fieldset label { display: inline-flex; margin-right: 16px; }
    button { width: 140px; padding: 10px; }
  </style>
</head>
<body>
  <h1>招聘申请测试表单</h1>
  <p>此页面只用于验证扩展，不会发送任何数据。</p>
  <form onsubmit="event.preventDefault(); alert('测试页不会提交')">
    <label>姓名<input name="candidate_name" placeholder="请输入姓名"></label>
    <label>手机号码<input name="mobile"></label>
    <label>邮箱地址<input type="email" name="email"></label>
    <label>当前城市<input name="city"></label>
    <label>期望职位<input name="desired_position"></label>
    <label>期望薪资<input name="salary_expectation"></label>
    <label>毕业院校<input name="university"></label>
    <label>学历<select name="degree"><option value="">请选择</option><option>大专</option><option>本科</option><option>硕士</option><option>博士</option></select></label>
    <label>所学专业<input name="major"></label>
    <label>LinkedIn<input name="linkedin_url"></label>
    <fieldset class="wide"><legend>性别</legend><div><label><input type="radio" name="gender" value="male">男</label><label><input type="radio" name="gender" value="female">女</label></div></fieldset>
    <label class="wide">个人优势<textarea name="self_summary" rows="4"></textarea></label>
    <label class="wide">作品介绍（富文本）<div contenteditable="true" aria-label="个人介绍"></div></label>
    <label class="wide">上传简历<input type="file" name="resume" accept=".pdf,.doc,.docx"></label>
    <label class="wide">上传头像（应忽略）<input type="file" name="avatar" accept="image/*"></label>
    <label>站内搜索（应忽略）<input type="search" name="search" placeholder="搜索职位"></label>
    <button type="submit">提交（测试）</button>
  </form>
</body>
</html>
